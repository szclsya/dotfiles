<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <match target="font">
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
  </match>

  <!-- Commonly used generic font names -->
  <alias>
    <family>system-ui</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>monospace</family></prefer>
  </alias>
  <!-- Substitution for Windows/Mac OS X fonts -->
  <alias>
    <family>Courier New</family>
    <prefer><family>monospace</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Times</family>
    <prefer><family>serif</family></prefer>
  </alias>
  <!-- Arial requires a stronger binding -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Arial</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- Default font for the zh-cn locale (no fc-match pattern) -->
  <match>
    <test compare="contains" name="lang">
      <string>zh-cn</string>
    </test>
    <test compare="contains" name="family">
      <string>sans-serif</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match>
    <test compare="contains" name="lang">
      <string>zh-cn</string>
    </test>
    <test compare="contains" name="family">
      <string>serif</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- Default font for Japanese -->
  <match>
    <test compare="contains" name="lang">
      <string>ja</string>
    </test>
    <test compare="contains" name="family">
      <string>sans-serif</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match>
    <test compare="contains" name="lang">
      <string>ja</string>
    </test>
    <test compare="contains" name="family">
      <string>serif</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <!-- Default sans-serif font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Inter</string>
    </edit>
  </match>

  <!-- Default serif fonts -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Source Serif 4</string>
    </edit>
  </match>

  <!-- Default monospace fonts -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Sarasa Term SC</string>
    </edit>
  </match>

  <!-- Fallback fonts preference order -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Serif 4</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Sarasa Term SC</family>
      <family>Sarasa Term TC</family>
      <family>Sarasa Term J</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
